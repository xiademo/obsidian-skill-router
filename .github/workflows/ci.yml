name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Verify installed CLI
        run: obsidian-skill-router --version

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and build tools
        run: python -m pip install . build==1.3.0 twine==6.2.0
      - name: Run hybrid agent-first release gate
        run: >-
          obsidian-skill-router --json eval
          --skills-root tests/fixtures/eval_hard_skills
          --cases tests/fixtures/eval_agent_first_redteam_cases.json
          --audit tests/fixtures/eval_multi_skill_cases.json
          --agent-first
          --strategy hybrid
          --gate-config tests/fixtures/release-gates.json
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          obsidian-skill-router --version
      - name: Test source distribution contents
        shell: bash
        run: |
          python -m venv /tmp/obsidian-router-sdist-venv
          /tmp/obsidian-router-sdist-venv/bin/python -m pip install dist/*.tar.gz
          mkdir -p /tmp/obsidian-router-sdist-src
          python -m tarfile -e dist/*.tar.gz /tmp/obsidian-router-sdist-src
          cd /tmp/obsidian-router-sdist-src/obsidian_skill_router-*
          /tmp/obsidian-router-sdist-venv/bin/python -m unittest discover -s tests -v
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
