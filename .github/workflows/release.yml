name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Run unit tests against installed wheel
        run: python -m unittest discover -s tests -v
      - name: Verify package metadata and tag
        run: python -c "import importlib.metadata as m, obsidian_skill_router as p, os; v=m.version('obsidian-skill-router'); assert v == p.__version__ and os.environ['GITHUB_REF_NAME'] == 'v' + v"
      - name: Verify tag points to the current default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse "origin/${DEFAULT_BRANCH}")"
      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
